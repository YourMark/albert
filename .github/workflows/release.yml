name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0-test)'
        required: true
        default: '1.0.0-test'
      dry_run:
        description: 'Dry run (build only, no release)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog step can diff against the
          # previous tag (the default shallow clone has only the tagged commit).
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Check if pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.version }}" =~ (alpha|beta|rc|dev|test) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Generate Mozart-scoped dependencies
        # Install WITH dev deps so Mozart is present; its post-install hook runs
        # `mozart compose`, producing vendor-prefixed/ (scoped under Albert\Vendor\).
        run: composer install --prefer-dist --no-progress

      - name: Install production dependencies
        # Strip dev deps (incl. mozart + the unscoped wordpress/* packages) and
        # rebuild the optimized prod autoloader. vendor-prefixed/ persists.
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Create plugin directory
        run: mkdir -p build/albert-ai-butler

      - name: Copy plugin files
        run: |
          # Core plugin files
          cp albert-ai-butler.php build/albert-ai-butler/
          cp composer.json build/albert-ai-butler/
          cp readme.txt build/albert-ai-butler/
          cp LICENSE build/albert-ai-butler/

          # Directories
          cp -r src build/albert-ai-butler/
          cp -r vendor build/albert-ai-butler/
          cp -r vendor-prefixed build/albert-ai-butler/

          # Optional directories (copy if they exist)
          [ -d "assets" ] && cp -r assets build/albert-ai-butler/ || true
          [ -d "languages" ] && cp -r languages build/albert-ai-butler/ || true

      - name: Strip build-only and disallowed vendor files
        run: |
          # wordpress/mcp-adapter + wordpress/php-mcp-schema are bundled into
          # src/Dependencies/ (Mozart-scoped under Albert\Vendor\). They must
          # NEVER ship unscoped in vendor/ — that would re-introduce the
          # WP\MCP\ namespace collision with WooCommerce's bundled copy.
          rm -rf build/albert-ai-butler/vendor/wordpress
          find build/albert-ai-butler/vendor -name "*.sh" -type f -delete

      - name: Create zip file
        working-directory: build
        run: zip -r albert-ai-butler-${{ steps.version.outputs.version }}.zip albert-ai-butler

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: albert-ai-butler-${{ steps.version.outputs.version }}
          path: build/albert-ai-butler

      - name: Generate changelog
        if: github.event.inputs.dry_run != 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Pre-release suffixes (e.g. 1.2.0-beta2) map to the base version's
          # readme section (= 1.2.0 =).
          BASE_VERSION="${VERSION%%-*}"

          # Prefer the curated readme.txt changelog section for this version:
          # everything between "= BASE_VERSION =" and the next "= x =" / "== ... ==".
          NOTES=$(awk -v ver="= ${BASE_VERSION} =" '
            $0 == ver { flag = 1; next }
            flag && ( /^= [0-9]/ || /^== / ) { exit }
            flag { print }
          ' readme.txt)

          # Fall back to the commit log since the previous tag if no section matched.
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREVIOUS_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD --no-merges)
            else
              NOTES=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
          fi

          # For pre-releases, note the build identifier above the section notes.
          if [ "${{ steps.prerelease.outputs.is_prerelease }}" = "true" ]; then
            printf 'Pre-release build (%s) of %s for testing.\n\n%s\n' "$VERSION" "$BASE_VERSION" "$NOTES" > changelog.txt
          else
            printf '%s\n' "$NOTES" > changelog.txt
          fi

          echo "changelog_file=changelog.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref }}
          body_path: changelog.txt
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          files: build/albert-ai-butler-${{ steps.version.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event.inputs.dry_run != 'true' &&
      ! contains(needs.build.outputs.version, 'alpha') &&
      ! contains(needs.build.outputs.version, 'beta') &&
      ! contains(needs.build.outputs.version, 'rc') &&
      ! contains(needs.build.outputs.version, 'dev') &&
      ! contains(needs.build.outputs.version, 'test')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Generate Mozart-scoped dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: albert-ai-butler
