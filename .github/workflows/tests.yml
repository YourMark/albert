name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
  release:
    types: [published]

jobs:
  unit:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: ./vendor/bin/phpunit --configuration phpunit-unit.xml.dist --no-coverage

  integration:
    name: Integration Tests (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        # Compatibility policy: WP 6.9 floor + last 2 main versions.
        #
        # 'trunk' is what gives us WordPress 7.1 coverage while 7.1 is still at
        # RC — it is the only identifier that keeps working across RC3 → RC4 →
        # GA without editing this file. Albert adopts the 7.1 Abilities API
        # (client schema preparation, the wp_get_abilities filtering pipeline,
        # the execution lifecycle) while staying functional on 6.9, so both ends
        # of that range have to stay green: 6.9 proves the fallbacks, trunk
        # proves the 7.1 path. After 7.1 ships, 'latest' covers it and 'trunk'
        # becomes early warning for 7.2.
        #
        # WooCommerce coverage is in its own job below.
        wordpress: ['latest', 'trunk', '6.9']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Subversion
        run: |
          # Third-party repos pre-installed on the runner (e.g. packages.microsoft.com)
          # intermittently serve a broken signature and fail `apt-get update`.
          # Subversion comes from the Ubuntu repos, so drop those sources first.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }} true

      - name: Run integration tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist --no-coverage

  integration-woocommerce:
    name: Integration Tests (WooCommerce ${{ matrix.woocommerce }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Compatibility policy: WC 10.5 floor + the two latest major versions.
        # 'latest' tracks the current release. When WooCommerce ships a new
        # major, slide the explicit middle entry one up — e.g. when WC 10.8
        # is current the matrix becomes ['latest', '10.7', '10.5'].
        woocommerce: ['latest', '10.6', '10.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Subversion
        run: |
          # Third-party repos pre-installed on the runner (e.g. packages.microsoft.com)
          # intermittently serve a broken signature and fail `apt-get update`.
          # Subversion comes from the Ubuntu repos, so drop those sources first.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Install WordPress test suite + WooCommerce
        env:
          WC_VERSION: ${{ matrix.woocommerce }}
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Run integration tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist --no-coverage
